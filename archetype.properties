# Parameters used to generate this project with aem-project-archetype

groupId=com.csuf.cloud
artifactId=csuf-cloud-project
version=1.0.0-SNAPSHOT
package=com.csuf.cloud
appId=csuf-cloud-project
appTitle=CSUF Cloud Project
aemVersion=cloud
sdkVersion=latest
languageCountry=${languageCountry}
includeExamples=n
includeErrorHandler=n
frontendModule=none
singleCountry=y
includeDispatcherConfig=y
includeCif=n
includeForms=n
includeFormsenrollment=y
includeFormscommunications=y
sdkFormsVersion=latest
commerceEndpoint=https://hostname.com/graphql
datalayer=y
amp=n
enableDynamicMedia=n
enableSSR=n
precompiledScripts=n
includeFormsheadless=y
